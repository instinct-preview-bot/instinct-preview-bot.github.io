<!doctype html>
<html dir="ltr" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spline-like 3D Editor</title>
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./inspector70/inspector.css">
<link rel="stylesheet" href="./image70/image70.css">
<link rel="stylesheet" href="./video70/video70.css">
<link rel="stylesheet" href="./mesh70/mesh70.css">
<link id="toolbar70-css" rel="stylesheet" href="./toolbar70/toolbar70.css">
  <link rel="stylesheet" href="./integration71/integration71.css">
  <link rel="stylesheet" data-timeline70="1" href="./timeline70/timeline70.css">
</head>
<body>
<header id="topbar">
  <button class="iconbtn" title="Menu"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 4h12M2 8h12M2 12h12"/></svg></button>
  <span class="docname">Untitled</span>
  <div class="seg" id="mode-seg">
    <button data-mode="preview">Preview</button><button data-mode="edit" class="on">Edit</button><button data-mode="code">Code</button>
  </div>
  <nav id="toolbar-center"></nav>
  <div class="right">
    <button class="btn" id="zoom-btn">100%</button>
    <button class="btn">Share</button>
    <button class="btn primary" id="export-btn">Export</button>
  </div>
</header>
<div id="work">
  <aside id="left" class="panel">
    <div class="tabs"><button class="on">Objects</button><button disabled title="بعدًا">Assets</button></div>
    <div class="sec-head"><span>Scenes</span><button class="iconbtn" id="add-scene-btn" title="Add scene"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 3v10M3 8h10"/></svg></button></div>
    <div id="sceneList"></div>
    <div class="search"><input id="outliner-search" placeholder="Search"></div>
    <div id="outliner"></div>
  </aside>
  <main id="stage">
    <canvas id="view"></canvas>
    <span id="gpu-badge" hidden>WebGL fallback</span>
    <div class="roundbtns">
      <button title="Camera view (قريبًا)" disabled><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="5" width="9" height="7" rx="1.5"/><path d="M11 7l3-2v7l-3-2"/></svg></button>
    </div>
    <div id="gizmo" title="Orientation"></div>
    <div id="hud"></div>
    <div id="codepanel" hidden>
      <div class="cp-bar"><span>Code</span><button class="btn" id="code-run">Run</button><button class="iconbtn" id="code-close">×</button></div>
      <textarea id="code-editor" spellcheck="false" dir="ltr"></textarea>
      <pre id="code-output" dir="ltr"></pre>
    </div>
  </main>
  <aside id="right" class="panel"><div id="inspector"></div></aside>
  <div id="timeline"></div>
</div>
<span id="selinfo" hidden></span>
<script type="module" src="./assets/startup.js"></script>
</body>
</html>
